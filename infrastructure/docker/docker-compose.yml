# Local development infrastructure for CrawlOps.
# Only PostgreSQL is required for the MVP. No paid/cloud services.
#
# Usage:
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#   docker compose -f infrastructure/docker/docker-compose.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: crawlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crawlops
      POSTGRES_PASSWORD: crawlops
      POSTGRES_DB: crawlops
    ports:
      # Host port 5433 to avoid clashing with a local/Homebrew PostgreSQL that
      # may already occupy 5432. Container still listens on 5432 internally.
      - '5433:5432'
    volumes:
      - crawlops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crawlops -d crawlops']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crawlops_pgdata:
