# nginx config for serving the CrawlOps Vite SPA.
# - Serves static assets from /usr/share/nginx/html
# - SPA fallback: any unknown path returns index.html so client-side routing
#   (react-router) works on deep links / refresh.
# - Listens on 8080 (non-privileged) so the container can run as non-root.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long cache for fingerprinted assets; no-cache for index.html.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight container health path (returns 200 without hitting the SPA).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
